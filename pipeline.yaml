apiVersion: tekton.dev/v1
kind: Pipeline

metadata:
  name: tax-calculator-pipeline

spec:
  workspaces:
    - name: source

  tasks:

    - name: npm-install
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: install
            image: node:20
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/sh
              set -e
              echo "Installing dependencies..."
              npm install
      workspaces:
        - name: source
          workspace: source

    - name: tests
      runAfter:
        - npm-install
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: test
            image: node:20
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/sh
              set -e
              echo "Running tests..."
              npm test
      workspaces:
        - name: source
          workspace: source

    - name: build
      runAfter:
        - tests
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: build
            image: node:20
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/sh
              set -e
              echo "Building application..."
              npm run build
      workspaces:
        - name: source
          workspace: source